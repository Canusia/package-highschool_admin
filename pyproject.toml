[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce-highschool-admin"
version = "0.0.1"
authors = [
  { name="Avi Kadaji", email="avi@canusia.com" },
]
description = "MyCE - High School Admin portal"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Canusia/package-highschool_admin"
